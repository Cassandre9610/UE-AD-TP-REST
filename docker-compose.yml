services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "3200:3200"
  
  booking:
    build: 
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3201:3201"
    environment:
      - SCHEDULE_HOST=schedule:3202

  schedule:
    build: 
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3202:3202"
    environment:
      - MOVIE_SERVICE_HOST=movie:3200

  user: 
    build: 
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "3203:3203"